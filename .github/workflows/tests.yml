name: architecture-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy safetensors pytest
      - name: Run architecture tests
        run: |
          python -m pytest \
            freb_caver/tests/test_judo_aligned_ce.py \
            freb_caver/tests/test_judo_semantic_refdiff.py \
            freb_caver/tests/test_judo_native_deep_residual.py \
            freb_caver/tests/test_judo_graft.py \
            freb_caver/tests/test_judo_caver.py \
            freb_caver/tests/test_mmad_tools.py -q
